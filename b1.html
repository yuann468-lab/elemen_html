<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMK TJP THE WINNER - Box Model</title>
    <style>
        /* SANGAT DIREKOMENDASIKAN! */
        * {
            box-sizing: border-box;
        }

        .kotak {
            /* Konten */
            width: 300px;
            height: 150px;

            /* Padding: atas kanan bawah kiri */
            padding: 20px 30px 20px 30px;

            /* Border - Shorthand */
            border: 3px solid #1A5276;
            
            /* Per sisi (dari bahan ke-3) */
            border-top: 4px solid #D4AC0D; /* sisi atas kuning */
            border-bottom: 1px dashed #BDC3C7; /* sisi bawah putus-putus */
            
            border-radius: 8px; /* sudut membulat */

            /* Margin auto biar di tengah */
            margin: 20px auto;

            /* Biar cantik dilihat */
            background-color: #EBF5FB;
            text-align: center;
            font-family: sans-serif;
            font-size: 18px;
            color: #1A5276;
            line-height: 110px;
        }
    </style>
</head>
<body>
    <h1 class="kotak">SMK TJP THE WINNER</h1>
</body>
</html>
