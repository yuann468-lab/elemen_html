<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    /* Selector Elemen - semua tag <h2> */
    h2 {
    color:#fdf902;
    border-bottom: 2px solid #e92f2f ;
    }
    h1 {
    color:#000000;
    border-bottom: 2px solid #f4f8f8 ;
    }

    /* Selector Class - elemen yang punya class='highlight' */
    .highlight {
    background-color:rgb(247, 172, 158);
    font-weight: bold;
    }
   
    /* Selector ID - elemen dengan id='hero' */
    #hero {
    background-color:rgb(226, 151, 138);
    color:white;
    padding: 40px
    }
    
    /* grouping - terapkan gaya yang sama ke h5 ,h4 ,h3 */
    h5, h4, h3 {
    font-family: 'Georgia', serif;
    color: #080808;
    }

    /* Pseudo-class - tautan saat di-hover */
    a:hover {
    color: red;
    text-decoration: underline;
    }


    </style>
</head>
<body>
    <h1>SELAMAT DATANG</h1>
    <h2>REKAYASA PERANGKAT LUNAK</h2>

    <a href="#">X RPL 2</a>

    <p class="highlight">Yuanita Putri Susanto</p>

    <p id="hero">Umur 15th</p>
</body>
</html>
