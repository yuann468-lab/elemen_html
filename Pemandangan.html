<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Web Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fcf0; /* Warna latar belakang krem pucat sesuai gambar */
            margin: 20px;
        }

        h1, h2 {
            color: black;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        p {
            line-height: 1.6;
        }

        .container {
            max-width: 800px; /* Batasi lebar konten agar terlihat seperti pada layar besar */
            margin: 0 auto;
        }

        .main-heading {
            font-size: 2.5em; /* Ukuran h1 */
        }

        .sub-heading {
            font-size: 1.8em; /* Ukuran h2 */
        }

        img {
            display: block; /* Agar gambar bisa dipusatkan */
            max-width: 100%; /* Agar gambar responsif */
            height: auto;
            border: 1px solid #ccc; /* Bingkai tipis untuk gambar */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2); /* Efek bayangan ringan */
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Utama (Selamat Datang...) -->
    <h1 class="main-heading">Selamat Datang di Halaman Web Saya</h1>

    <!-- Paragraf Penjelasan -->
    <p>Ini adalah contoh paragraf yang menggunakan <strong>teks tebal (bold)</strong>, <em>teks miring (italic)</em>, dan <u>teks bergaris bawah (underline)</u>.</p>

    <!-- Judul untuk Gambar -->
    <h2 class="sub-heading">Gambar Pemandangan</h2>

    <!-- Elemen Gambar -->
    <!-- Ganti 'pemandangan.jpg' dengan URL atau path gambar Anda yang sebenarnya -->
    <!-- Untuk meniru persis gambar, saya sarankan menggunakan gambar pemandangan dengan komposisi horizontal di mana langit dan laut dipisahkan oleh garis cakrawala. -->
    <img src="yuan.avif" alt="Pemandangan ">

    <!-- Judul untuk Tautan -->
    <h2 class="sub-heading">Tautan Luar</h2>

    <!-- Paragraf dengan Tautan -->
    <p>Kunjungi <a href="https://unsplash.com/id/foto/pemandangan-indah-perairan-yang-dikelilingi-oleh-pegunungan-_zRxA8IvmZE" target="_blank">Google</a> untuk mencari informasi lebih lanjut.</p>
</div>

</body>
</html>
